<!doctype html>
<html lang="en">
	<head>
		<meta name="viewport" content="width=device-width" />

		<title>Normalize</title>

		<link rel="stylesheet" href="../src/_normalize.css" />
		<link rel="stylesheet" href="demo.css" />

		<link rel="icon" href="data:," />
	</head>
	<body>
		<main>
			<h1>Normalize</h1>

			<section>
				<h2>Text color for <code>a</code> without <code>href</code></h2>

				<p>
					<a><code>a</code> without <code>href</code></a>
				</p>
			</section>

			<section>
				<h2>Font for form controls</h2>

				<p>
					<label>Text (en): <input value="input" /></label>
				</p>
				<p lang="ja">
					<label>Text (ja): <input value="入力" /></label>
				</p>

				<p>
					<label>File (en): <input type="file" /></label>
				</p>
				<p lang="ja">
					<label>File (ja): <input type="file" /></label>
				</p>

				<p>
					<label>
						Select (en):
						<select>
							<option>option</option>
						</select>
					</label>
				</p>
				<p lang="ja">
					<label>
						Select (ja):
						<select>
							<option>選択肢</option>
						</select>
					</label>
				</p>

				<p><button>button (en)</button></p>
				<p lang="ja"><button>ボタン (ja)</button></p>

				<p>
					<label>Textarea (en): <textarea>Textarea</textarea></label>
				</p>
				<p lang="ja">
					<label>Textarea (ja): <textarea>テキストエリア</textarea></label>
				</p>
			</section>

			<section>
				<h2>Margin for <code>checkbox</code> and <code>radio</code></h2>

				<p>
					<label><input type="checkbox" /> Checkbox</label>
				</p>
				<p>
					<label><input type="radio" /> Radio</label>
				</p>
			</section>

			<section>
				<h2><code>font-style</code> for <code>optgroup</code></h2>

				<p>
					<label>
						Select:
						<select>
							<option>▼</option>
							<optgroup label="optgroup">
								<option>option in optgroup</option>
							</optgroup>
						</select>
					</label>
				</p>
			</section>

			<section>
				<h2>Margin for <code>textarea</code></h2>

				<p>
					<label>Textarea: <textarea></textarea></label>
				</p>
			</section>

			<section>
				<h2><code>::-webkit-details-marker</code></h2>

				<details>
					<summary>summary</summary>
					details
				</details>
			</section>
		</main>
	</body>
</html>
